[package]
name = "errand-box"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "0BSD"
description = "Sets up Incus, a guest image, kage and errand on a Linux host, and gives errand a bailey that runs each session in an Incus system container"
repository = "https://github.com/AvalynSouvlaki/errand-box"
publish = false

[[bin]]
name = "errand-box"
path = "src/main.rs"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
