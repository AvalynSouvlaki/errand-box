# A sweep for things that must never be published.
# docs/security/secrets.md, docs/public/README.md
#
# IT FINDS THE SHAPES IT KNOWS. It will not find a password that looks like a
# word, a hostname that reads as prose, or a page of correct-looking examples
# that happens to describe a real system. It narrows the reading. It does not
# replace it, and a green run is not a clearance.

name: secret-sweep

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege at the top level: nothing. A job needing more says so itself.
permissions: {}

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The checkout reads the repository. Nothing here writes to it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: a credential file is tracked
        run: |
          bad=$(git ls-files | grep -E '(^|/)(\.env(\..*)?|\.dev\.vars(\..*)?|.*\.(pem|key|p12|pfx|keystore)|id_rsa|id_ed25519)$' | grep -v '\.example$' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "these are tracked and must not be"
            exit 1
          fi
          echo clean

      - name: secret-shaped strings
        run: sh scripts/common/check-no-secrets.sh
