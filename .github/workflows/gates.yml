# The gates, in CI. Part (a) of the three-part gate.
# docs/methodology/gate.md
#
# This runs the SAME checks the local gate runs. It is a second place they run,
# not a second set of rules. When they diverge, the local one is what a session
# actually experiences and this one is the defect.
#
# EVERY STEP RUNS LOCALLY TOO. Each `run:` block is POSIX sh with no network
# and no secret. Paste it into a shell at the repository root and read the exit
# code unpiped. CI can be off on a fork and the gate still runs.
#
# PIN EVERY THIRD-PARTY ACTION TO A COMMIT, NOT A TAG. A tag moves, and a moved
# tag runs code you did not review with the permissions you granted. Resolve
# the commit for a tag with:
#
#   gh api repos/actions/checkout/git/ref/tags/v4 --jq .object.sha
#
# then write it as:  uses: actions/checkout@THE_SHA  # v4

name: gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege at the top level: nothing. A job needing more says so itself.
permissions: {}

# A newer push cancels an in-flight run for the same ref. On the default branch
# that can cancel the run for a commit nobody looks at again, so it is scoped
# to pull requests only.
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # The checkout reads the repository. Nothing here writes to it.
    permissions:
      contents: read
    steps:
      # fetch-depth 0, not 1, and the reason is check-attribution. It reads
      # `git log` rather than the tree, so a one-commit checkout makes it scan
      # one message and report success about the whole history. It says so on
      # its own, and a report nobody reads is not a scope.
      # Set this back to 1 only if the project drops that check. A full fetch
      # costs seconds on a small repository and more on a large one.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The probe. Cheap, and it makes a CI failure legible.
      - name: probe the runner
        run: sh scripts/doctor/doctor.sh --fast

      # Part (a) of the gate, in one command, rather than a list of steps
      # that drifts from the list in docs/methodology/gate.md.
      #
      # --strict IS THE CI MODE. A skipped check is not a passed one, and on
      # a runner the tools are installed on purpose: a SKIP here means the
      # install broke, not that the machine is modest. On a laptop, drop it.
      #
      # Do not replace this step with a hand-written list of the same checks:
      # two lists is how one of them stops being maintained.
      - name: the gate, and the record agrees with itself
        run: sh scripts/ci-local.sh --step gate

      # The project's own steps. Each calls scripts/ci-local.sh, which is
      # what a session runs before a push, so the two lists cannot drift.
      # rustup on the runner installs the toolchain rust-toolchain.toml
      # names on the first cargo call. Each step on its own, so the log says
      # which one failed.
      - name: no daemon is signalled by name (E-12)
        run: sh scripts/ci-local.sh --step kill-by-name
      - name: shellcheck
        run: sh scripts/ci-local.sh --step shellcheck
      - name: format
        run: sh scripts/ci-local.sh --step fmt
      - name: clippy
        run: sh scripts/ci-local.sh --step clippy
      - name: test
        run: sh scripts/ci-local.sh --step test
      - name: the pin mover
        run: sh scripts/ci-local.sh --step pins
      - name: the pinned errand accepts the config errand-box writes
        run: sh scripts/ci-local.sh --step errand-config

      # Tracked plus untracked-but-not-ignored, so the same block gives the
      # right answer on a laptop before the first commit. A run over zero files
      # is refused: it would report a pass over nothing.
      - name: shell scripts parse
        run: |
          fail=0
          n=0
          for f in $( { git ls-files '*.sh'; git ls-files --others --exclude-standard '*.sh'; } | sort -u ) .githooks/commit-msg; do
            [ -f "$f" ] || continue
            n=$((n + 1))
            sh -n "$f" || fail=1
          done
          [ "$n" -gt 0 ] || { echo "no shell scripts found"; exit 1; }
          echo "$n scripts parse"
          exit $fail

      - name: line endings match .gitattributes
        run: |
          # git own answer, not a second table of rules.
          bad=$(git ls-files --eol | grep -v 'i/lf' | grep -v 'i/-text' || true)
          if [ -n "$bad" ]; then
            echo "$bad"
            echo "index endings disagree with .gitattributes"
            exit 1
          fi
          echo clean

  # The static release binary, on each architecture a release ships.
  musl:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build and run the static binary
        run: sh scripts/ci-local.sh --step musl
